name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What problem would this solve?
      description: Describe the workflow that's painful or missing today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: How you imagine it working. Rough ideas welcome.
